<!DOCTYPE html>
<html lang="en">

<title>Tulsa County Ballot Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap">
<style>
/* Layout: TPS bond-dashboard theme (dark navy, Bebas Neue, Plex Mono labels). Sticky tab bar, one view per ballot section, each section color-coded; candidate cards in a responsive grid. Deliberately dark-only, matching the source theme. */
:root {
  --bg: #07090f;
  --surface: #0e1420;
  --surface2: #141d2e;
  --surface3: #1a2540;
  --border: #1c2a40;
  --text: #dce6f5;
  --muted: #6f84a3;
  --p1: #f5a623;
  --p2: #38bdf8;
  --p3: #a78bfa;
  --p4: #84cc16;
  --p5: #2dd4bf;
  --pro: #34d399;
  --con: #f43f5e;
  --f-display: "Bebas Neue", Impact, "Arial Narrow", sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--text); font: 15px/1.6 var(--f-body); min-height: 100%; overflow-x: hidden; }
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse at 15% 30%, rgba(245,166,35,0.05) 0%, transparent 50%),
    radial-gradient(ellipse at 85% 20%, rgba(56,189,248,0.05) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 85%, rgba(167,139,250,0.04) 0%, transparent 50%);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 101; background: var(--surface); }
a { color: var(--p2); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--p2); outline-offset: 2px; }

/* NAV */
nav.tabs {
  display: flex; background: var(--surface); border-bottom: 1px solid var(--border);
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 100;
  overflow-x: auto; scrollbar-width: none; scroll-snap-type: x proximity;
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
nav.tabs::-webkit-scrollbar { display: none; }
@media (max-width: 760px) {
  nav.tabs { -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); mask-image: linear-gradient(90deg, #000 85%, transparent); }
  .tab { padding: 15px 14px; }
  .card { padding: 16px; }
  .panel-head, .panel-text { padding-left: 16px; padding-right: 16px; }
  .plist li { padding-left: 16px; padding-right: 16px; }
}
.tab {
  font-family: var(--f-mono); font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
  padding: 15px 22px; border: 0; border-right: 1px solid var(--border); border-bottom: 3px solid transparent;
  background: none; color: var(--muted); cursor: pointer; white-space: nowrap; scroll-snap-align: start;
  transition: color .2s, background .2s; display: flex; gap: 8px; align-items: center;
}
.tab:hover { color: var(--text); background: var(--surface2); }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--c, #fff); background: var(--surface2); }
.tab .ct { font-size: 10px; color: var(--c, var(--muted)); letter-spacing: 1px; }

.view { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding-block: 36px 64px;
  padding-left: max(48px, env(safe-area-inset-left, 0px)); padding-right: max(48px, env(safe-area-inset-right, 0px)); }
@media (max-width: 1100px) { .view { padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); } }
@media (max-width: 760px) { .view { padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); } }

.label { font-family: var(--f-mono); font-size: 11px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; }

/* HERO */
.hero { text-align: center; padding: 32px 0 44px; border-bottom: 1px solid var(--border); margin-bottom: 40px; display: grid; gap: 12px; justify-items: center; }
.hero-total { font-family: var(--f-display); font-size: clamp(52px, 10vw, 120px); letter-spacing: 4px; line-height: .95; text-wrap: balance;
  background: linear-gradient(135deg, var(--p1), var(--p2), var(--p3), var(--p4)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.hero-sub { font-size: 15px; color: var(--muted); max-width: 62ch; }
.hero-meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 6px; }
.pill { font-family: var(--f-mono); font-size: 11px; letter-spacing: 1px; padding: 6px 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--muted); }
.pill b { color: var(--text); font-weight: 600; }

.section-title { margin-bottom: 16px; }
.block { margin-bottom: 40px; }

/* Section cards on overview */
.sec-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.sec-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 22px 24px 20px; cursor: pointer; text-align: left;
  position: relative; overflow: hidden; transition: transform .2s, border-color .2s, box-shadow .2s; display: grid; gap: 6px; }
.sec-card::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; background: var(--c); }
.sec-card:hover { transform: translateY(-3px); border-color: var(--c); box-shadow: 0 8px 32px rgba(0,0,0,.4); }
.sec-name { font-family: var(--f-display); font-size: 26px; letter-spacing: 1px; line-height: 1.05; }
.sec-desc { font-size: 13px; color: var(--muted); }
.sec-count { font-family: var(--f-display); font-size: 40px; letter-spacing: 2px; color: var(--c); line-height: 1; margin-top: 6px; }
.bar { height: 4px; background: var(--bg); border-radius: 2px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--c); border-radius: 2px; transition: width .6s cubic-bezier(.16,1,.3,1); }
.hint { font-family: var(--f-mono); font-size: 10px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-top: 8px; }

.notes { display: grid; gap: 10px; }
.note { display: flex; gap: 16px; align-items: flex-start; padding: 16px 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
.note-body { flex: 1; min-width: 0; }
.note-title { font-weight: 600; font-size: 14px; margin-bottom: 2px; }
.note-text { font-size: 13px; color: var(--muted); }
.tag { font-family: var(--f-mono); font-size: 10px; letter-spacing: 1px; padding: 3px 8px; border-radius: 3px; white-space: nowrap; font-weight: 600; border: 1px solid; flex-shrink: 0; }
.tag-blue { background: rgba(56,189,248,.12); color: var(--p2); border-color: rgba(56,189,248,.3); }
.tag-yellow { background: rgba(245,166,35,.12); color: var(--p1); border-color: rgba(245,166,35,.3); }
.tag-red { background: rgba(244,63,94,.12); color: var(--con); border-color: rgba(244,63,94,.3); }
@media (max-width: 560px) { .note { flex-direction: column; gap: 8px; } }

/* VIEW HEADER */
.pv-head { margin-bottom: 24px; display: grid; gap: 6px; }
.pv-head h2 { font-family: var(--f-display); font-size: clamp(34px, 5vw, 52px); letter-spacing: 2px; line-height: 1; color: var(--text); }
.pv-head h2 span { color: var(--c); }
.pv-intro { color: var(--muted); max-width: 72ch; font-size: 14px; }

.jump { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; margin-bottom: 28px; }
.jump::-webkit-scrollbar { display: none; }
.jump a { font-family: var(--f-mono); font-size: 11px; letter-spacing: 1px; text-decoration: none; color: var(--muted); white-space: nowrap;
  padding: 6px 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); display: flex; gap: 6px; align-items: center; }
.jump a:hover { color: var(--text); border-color: var(--c); }
.jump a.done { color: var(--text); }
.jump a.done::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }

/* CONTEST PANEL */
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 24px; overflow: hidden; scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 64px); }
.panel-head { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; align-items: flex-start; }
.panel-head > div { min-width: 0; display: grid; gap: 4px; }
.panel-title { font-family: var(--f-display); font-size: 26px; letter-spacing: 1px; line-height: 1.05; }
.panel-sub { font-family: var(--f-mono); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.panel-note { font-size: 13px; color: var(--muted); max-width: 80ch; }
.status-chip { font-family: var(--f-mono); font-size: 10px; letter-spacing: 1px; padding: 4px 10px; border-radius: 3px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
.status-chip.on { color: var(--c); border-color: var(--c); }
.panel-text { padding: 16px 20px; border-bottom: 1px solid var(--border); font-size: 14px; display: grid; gap: 10px; }
.panel-text p { max-width: 80ch; }
.panel-text .bg { color: var(--muted); font-size: 13px; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 1px; background: var(--border); }
.bl { border-top: 1px solid var(--border); padding: 14px 20px 16px; background: rgba(245,166,35,.05); display: grid; gap: 6px; font-size: 13px; }
.bl-top { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
.bl-label { font-family: var(--f-mono); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--p1); font-weight: 600; }
.bl-pick { font-family: var(--f-display); font-size: 19px; letter-spacing: 1px; line-height: 1.1; }
.bl p { color: var(--muted); max-width: 90ch; }
.bl a { color: var(--p1); white-space: nowrap; }
@media (max-width: 760px) { .bl { padding-left: 16px; padding-right: 16px; } }
.cards.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cards.two .pick { padding: 8px 10px; letter-spacing: 1px; }
.card { background: var(--surface); padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 10px; min-width: 0; transition: background .15s; position: relative; }
.card:hover { background: var(--surface2); }
.card.chosen { background: var(--surface3); }
.card.chosen::before { content: ""; position: absolute; inset: 0 0 auto; height: 3px; background: var(--c); }
.card-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.cand-name { font-family: var(--f-display); font-size: 24px; letter-spacing: 1px; line-height: 1.05; }
.party { font-family: var(--f-mono); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
.bio { font-size: 13px; color: var(--muted); }
.pc { display: grid; gap: 10px; }
.pc h4 { font-family: var(--f-mono); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; font-weight: 600; margin-bottom: 4px; }
.pros h4 { color: var(--pro); }
.cons h4 { color: var(--con); }
.pc ul { list-style: none; display: grid; gap: 6px; font-size: 13px; }
.pc li { padding-left: 16px; position: relative; }
.pc li::before { position: absolute; left: 0; top: 0; font-family: var(--f-mono); font-weight: 600; }
.pros li::before { content: "+"; color: var(--pro); }
.cons li::before { content: "−"; color: var(--con); }
.thin { font-size: 13px; color: var(--muted); font-style: italic; }

.pick { margin-top: auto; align-self: flex-start; font-family: var(--f-mono); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; font-weight: 600;
  padding: 8px 14px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg); color: var(--muted); cursor: pointer; transition: all .15s; }
.pick:hover { color: var(--text); border-color: var(--c); }
.pick[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: #07090f; }

/* PICKS */
.picks-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 20px; margin-bottom: 24px; }
.plist { list-style: none; }
.plist li { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; padding: 10px 20px; border-bottom: 1px solid var(--border); font-size: 13px; }
.plist li:last-child { border-bottom: 0; }
.plist li span:first-child { color: var(--muted); }
.plist li a { color: inherit; text-decoration: none; }
.plist li a:hover { color: var(--text); }
.plist li.empty span:last-child { color: var(--muted); font-style: italic; }
.plist li:not(.empty) span:last-child { color: var(--c); font-weight: 600; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { font-family: var(--f-mono); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; font-weight: 600; padding: 11px 18px; border-radius: 4px; cursor: pointer;
  border: 1px solid var(--bc, var(--p2)); background: var(--bc, var(--p2)); color: #07090f; }
.btn.ghost { background: transparent; color: var(--text); border-color: var(--border); }
.btn.ghost:hover { border-color: var(--con); color: var(--con); }
.status { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }

.sources ul { list-style: none; columns: 2 300px; column-gap: 32px; font-size: 13px; }
.sources li { break-inside: avoid; padding: 6px 0; border-bottom: 1px solid var(--border); }
.sources a { color: var(--text); text-decoration: none; }
.sources a:hover { color: var(--p2); }
.disclaimer { font-size: 13px; color: var(--muted); max-width: 80ch; margin-bottom: 16px; }

footer { position: relative; z-index: 1; text-align: center; font-family: var(--f-mono); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); padding: 0 16px 32px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

// ---------- picks storage ----------
const KEY = "ballotguide-picks";
let picks = {};
try { picks = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { picks = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(picks)); } catch (e) {} }

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ul = items => "<ul>" + items.map(i => `<li>${esc(i)}</li>`).join("") + "</ul>";
const sec = k => SECTIONS.find(x => x.key === k);
const inSec = k => DATA.filter(c => c.s === k);
const doneIn = k => inSec(k).filter(c => picks[c.id]).length;
const contestLabel = c => c.kind === "retain" ? `Retain ${c.title}` : c.title.split(":")[0];

function card(c, choice, head, inner) {
  const on = picks[c.id] === choice;
  return `<div class="card${on ? " chosen" : ""}" data-c="${c.id}" data-v="${esc(choice)}">
    <div class="card-top"><div>${head}</div></div>${inner}
    <button class="pick" aria-pressed="${on}">${on ? "My pick" : "Mark as my pick"}</button></div>`;
}
const pc = (a, pros, b, cons) => `<div class="pc"><div class="pros"><h4>${a}</h4>${ul(pros)}</div><div class="cons"><h4>${b}</h4>${ul(cons)}</div></div>`;

function contestPanel(c) {
  let pre = "", cards = "";
  if (c.kind === "race") {
    cards = c.options.map(o => {
      const head = `<div class="cand-name">${esc(o.name)}</div>${o.party ? `<div class="party">${o.party}</div>` : ""}`;
      if (o.thin) return card(c, o.name, head, `<p class="thin">No platform, website or news coverage turned up for this candidate. A vote here mainly registers a choice against both major-party nominees.</p>`);
      return card(c, o.name, head, (o.bio ? `<p class="bio">${esc(o.bio)}</p>` : "") + pc("Pros", o.pros, "Cons", o.cons));
    }).join("");
  } else if (c.kind === "retain") {
    pre = `<div class="panel-text"><p>${esc(c.bio)}</p></div>`;
    cards = card(c, "Yes, retain", `<div class="cand-name">Yes</div><div class="party">Keep for six more years</div>`, "") +
            card(c, "No, remove", `<div class="cand-name">No</div><div class="party">Governor appoints a replacement</div>`, "");
  } else {
    pre = `<div class="panel-text"><p>${esc(c.summary)}</p><p class="bg">${esc(c.background)}</p></div>`;
    cards = card(c, "Yes, for the proposal", `<div class="cand-name">Yes</div><div class="party">For the proposal</div>`, pc("Arguments for", c.yes, "Risk if it passes", [c.no[0]])) +
            card(c, "No, against the proposal", `<div class="cand-name">No</div><div class="party">Against the proposal</div>`, pc("Arguments against", c.no, "Cost of a no", [c.yes[0]]));
  }
  const v = picks[c.id];
  return `<section class="panel" id="${c.id}">
    <div class="panel-head"><div><div class="panel-sub">${esc(c.sub)}</div><h3 class="panel-title">${esc(c.title)}</h3>${c.note ? `<p class="panel-note">${esc(c.note)}</p>` : ""}</div>
    <span class="status-chip${v ? " on" : ""}" data-chip="${c.id}">${v ? esc(v) : "Not marked"}</span></div>
    ${pre}<div class="cards${c.kind === "retain" ? " two" : ""}">${cards}</div>${blNote(c.id)}</section>`;
}

function viewOverview() {
  const total = DATA.length, done = DATA.filter(c => picks[c.id]).length;
  const d = daysLeft();
  const cards = SECTIONS.filter(s => s.key !== "overview" && s.key !== "picks").map(s => {
    const n = inSec(s.key).length, k = doneIn(s.key);
    return `<button class="sec-card" style="--c:${s.color}" data-go="${s.key}">
      <span class="label">${n} ${n === 1 ? "contest" : "contests"}</span>
      <span class="sec-name">${s.name}</span><span class="sec-desc">${s.desc}</span>
      <span class="sec-count">${k}/${n}</span><span class="bar"><i style="width:${n ? k / n * 100 : 0}%"></i></span>
      <span class="hint">Open section →</span></button>`;
  }).join("");
  return `<div class="hero">
      <div class="label">General Election · Tulsa County, Oklahoma</div>

      <div class="note"><div class="note-body"><div class="note-title">Mark your picks as you read</div><div class="note-text">Each card has a "Mark as my pick" button. Your choices collect on the My Picks tab, saved in this browser only. You can bring notes into the booth.</div></div><span class="tag tag-blue">How to use</span></div>
      <div class="note"><div class="note-body"><div class="note-title">Bring ID</div><div class="note-text">Oklahoma asks for a photo ID or your county voter ID card at the polls.</div></div><span class="tag tag-blue">Polling place</span></div>
      <div class="note"><div class="note-body"><div class="note-title">Some entries are thin</div><div class="note-text">Little public information exists for several independent candidates and the Court of Civil Appeals judges. Confirm anything decisive with the Tulsa County Election Board.</div></div><span class="tag tag-red">Limited info</span></div>
    </div></div>`;
}

function viewSection(s) {
  const list = inSec(s.key);
  const jump = list.map(c => `<a href="#${c.id}" data-jump="${c.id}" class="${picks[c.id] ? "done" : ""}">${esc(c.kind === "retain" ? c.title : contestLabel(c))}</a>`).join("");
  const general = s.key === "retention" ? `<section class="panel"><div class="panel-head"><div><div class="panel-sub">Applies to every judge below</div><h3 class="panel-title">The case for and against retaining</h3></div></div>
    <div class="cards"><div class="card">${pc("Case for yes", RETAIN_YES, "Keep in mind", ["A yes also endorses the court's recent rulings, which you may or may not agree with."])}</div>
    <div class="card">${pc("Case for no", RETAIN_NO, "Keep in mind", ["You don't choose the replacement; the nominating commission and governor do."])}</div></div></section>` : "";
  const keys = SECTIONS.map(x => x.key), next = SECTIONS[keys.indexOf(s.key) + 1];
  return `<div class="pv-head"><div class="label">${list.length} contests · ${doneIn(s.key)} marked</div><h2><span>${s.name}</span></h2><p class="pv-intro">${s.intro}</p></div>
    <div class="jump">${jump}</div>${general}${list.map(contestPanel).join("")}
    <div class="btns"><button class="btn" style="--bc:${next.color}" data-go="${next.key}">Next: ${next.name} →</button><button class="btn ghost" data-top>Back to top</button></div>`;
}

function viewPicks() {
  const groups = SECTIONS.filter(s => s.key !== "overview" && s.key !== "picks").map(s =>
    `<div class="panel" style="--c:${s.color}"><div class="panel-head"><div><div class="panel-sub">${doneIn(s.key)} of ${inSec(s.key).length} marked</div><h3 class="panel-title" style="color:${s.color}">${s.name}</h3></div></div>
     <ol class="plist">${inSec(s.key).map(c => `<li class="${picks[c.id] ? "" : "empty"}"><span><a href="#${c.id}" data-find="${c.id}">${esc(contestLabel(c))}</a></span><span>${picks[c.id] ? esc(picks[c.id]) : "Not marked"}</span></li>`).join("")}</ol></div>`).join("");
  return `<div class="pv-head"><div class="label">Cheat sheet</div><h2><span>My Picks</span></h2><p class="pv-intro">Everything you've marked, in ballot order. Copy it to your phone or notes app to take with you.</p></div>
    <div class="btns block"><button class="btn" id="copy">Copy my picks</button><button class="btn ghost" id="clear">Clear all</button><span class="status" id="status" role="status"></span></div>
    <div class="picks-grid">${groups}</div>
    <div class="block sources"><div class="label section-title">Sources</div>
      <p class="disclaimer">Built from the Tulsa County sample ballot and October 2026 reporting. Candidate details can change; confirm anything decisive with the Oklahoma State Election Board or the Tulsa County Election Board.</p>
      <ul>${SOURCES.map(([t, u]) => `<li><a href="${u}" target="_blank" rel="noopener">${esc(t)} ↗</a></li>`).join("")}</ul></div>`;
}

let current = "overview";
function show(key, scrollTo) {
  const s = sec(key) || sec("overview");
  current = s.key;
  document.getElementById("tabs").innerHTML = SECTIONS.map(x => {
    const n = inSec(x.key).length;
    const ct = x.key === "overview" || x.key === "picks" ? (x.key === "picks" ? `${DATA.filter(c => picks[c.id]).length}/${DATA.length}` : "") : `${doneIn(x.key)}/${n}`;
    return `<button class="tab" role="tab" style="--c:${x.color}" data-go="${x.key}" aria-selected="${x.key === s.key}">${x.name}${ct ? `<span class="ct">${ct}</span>` : ""}</button>`;
  }).join("");
  const v = document.getElementById("views");
  v.innerHTML = `<main class="view" style="--c:${s.color}">${s.key === "overview" ? viewOverview() : s.key === "picks" ? viewPicks() : viewSection(s)}</main>`;
  const active = document.querySelector('.tab[aria-selected="true"]');
  if (active) active.parentNode.scrollLeft = active.offsetLeft - 16;
  if (scrollTo) { const el = document.getElementById(scrollTo); if (el) el.scrollIntoView(); }
  else window.scrollTo(0, 0);
  try { history.replaceState(null, "", "#" + s.key); } catch (e) {}
}

function daysLeft() {
  const now = new Date();
  const d = Math.round((new Date(2026, 10, 3) - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 864e5);
  return d > 1 ? `${d} days to go` : d === 1 ? "Tomorrow" : d === 0 ? "Today" : null;
}

function refreshCounts(id) {
  document.querySelectorAll(`.card[data-c="${id}"]`).forEach(r => {
    const on = picks[id] === r.dataset.v;
    r.classList.toggle("chosen", on);
    const b = r.querySelector(".pick"); b.setAttribute("aria-pressed", on); b.textContent = on ? "My pick" : "Mark as my pick";
  });
  const chip = document.querySelector(`[data-chip="${id}"]`);
  if (chip) { chip.textContent = picks[id] || "Not marked"; chip.classList.toggle("on", !!picks[id]); }
  const j = document.querySelector(`[data-jump="${id}"]`); if (j) j.classList.toggle("done", !!picks[id]);
  const head = document.querySelector(".pv-head .label");
  const s = sec(current);
  if (head && s && inSec(s.key).length) head.textContent = `${inSec(s.key).length} contests · ${doneIn(s.key)} marked`;
  document.querySelectorAll(".tab").forEach(t => {
    const k = t.dataset.go, ct = t.querySelector(".ct"); if (!ct) return;
    ct.textContent = k === "picks" ? `${DATA.filter(c => picks[c.id]).length}/${DATA.length}` : `${doneIn(k)}/${inSec(k).length}`;
  });
}

document.addEventListener("click", e => {
  if (e.target.closest("[data-top]")) { window.scrollTo(0, 0); return; }
  const go = e.target.closest("[data-go]");
  if (go) { show(go.dataset.go); return; }
  const find = e.target.closest("[data-find]");
  if (find) { e.preventDefault(); const c = DATA.find(x => x.id === find.dataset.find); show(c.s, c.id); return; }
  const jump = e.target.closest("[data-jump]");
  if (jump) { e.preventDefault(); document.getElementById(jump.dataset.jump).scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); return; }
  const pick = e.target.closest(".pick");
  if (pick) {
    const r = pick.closest(".card"), id = r.dataset.c, v = r.dataset.v;
    if (picks[id] === v) delete picks[id]; else picks[id] = v;
    save(); refreshCounts(id); return;
  }
  if (e.target.id === "copy") {
    const status = document.getElementById("status");
    const text = "My ballot picks, Nov 3 2026 (Tulsa County)\n" + DATA.map(c => `${contestLabel(c)}: ${picks[c.id] || "-"}`).join("\n");
    navigator.clipboard.writeText(text).then(() => status.textContent = "Copied to clipboard.").catch(() => {
      const r = document.createRange(); r.selectNodeContents(document.querySelector(".picks-grid"));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      status.textContent = "Copy was blocked. The list is selected; press Ctrl+C.";
    });
    return;
  }
  if (e.target.id === "clear") {
    if (e.target.dataset.armed) { picks = {}; save(); show("picks"); document.getElementById("status").textContent = "All picks cleared."; }
    else { e.target.dataset.armed = "1"; e.target.textContent = "Click again to clear"; document.getElementById("status").textContent = "This removes every pick you've marked."; }
  }
});

const start = (location.hash || "").slice(1);
const startContest = DATA.find(c => c.id === start);
startContest ? show(startContest.s, startContest.id) : show(sec(start) ? start : "overview");
</script>
